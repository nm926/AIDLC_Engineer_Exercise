name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - develop
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.5

jobs:
  approval:
    name: Approval Gate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Infrastructure ${{ github.event.inputs.action }} approved for ${{ github.event.inputs.environment }}
        run: echo "✓ Deployment to ${{ github.event.inputs.environment }} approved"

  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    needs: [approval]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=eks-${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan
          
          # Save plan for apply
          terraform show -json tfplan > tfplan.json
      
      - name: Upload plan
        uses: actions/upload-artifact@v3
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: terraform/tfplan
          retention-days: 1
      
      - name: Show Plan Summary
        working-directory: terraform
        run: |
          echo "Plan Summary:"
          terraform show -no-color tfplan | grep -E "^(Plan:|~|\\+|-)" | head -20
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
          
          echo "Terraform apply completed successfully"
      
      - name: Terraform Destroy (Confirm Required)
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: |
          echo "⚠️  DESTROY OPERATION REQUESTED"
          echo "This will destroy all infrastructure in ${{ github.event.inputs.environment }}"
          echo ""
          echo "Review the plan above carefully before confirming."
          echo ""
          terraform destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -auto-approve
      
      - name: Export outputs
        working-directory: terraform
        run: |
          terraform output -json > outputs.json
          cat outputs.json
      
      - name: Upload outputs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: terraform/outputs.json
      
      - name: Post deployment
        if: github.event.inputs.action == 'apply'
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "                  INFRASTRUCTURE DEPLOYED"
          echo "═══════════════════════════════════════════════════════════════"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Next steps:"
          echo "1. Verify EKS cluster connectivity"
          echo "2. Deploy applications to new infrastructure"
          echo "3. Run smoke tests"
          echo "4. Monitor for 24 hours"
          echo "═══════════════════════════════════════════════════════════════"

  backup-state:
    name: Backup Terraform State
    runs-on: ubuntu-latest
    needs: [terraform]
    if: always() && github.event.inputs.action != 'destroy'
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Backup state to S3
        run: |
          BACKUP_DATE=$(date +%Y-%m-%d_%H-%M-%S)
          aws s3 cp \
            "s3://${{ secrets.TERRAFORM_STATE_BUCKET }}/eks-${{ github.event.inputs.environment }}/terraform.tfstate" \
            "s3://${{ secrets.TERRAFORM_STATE_BUCKET }}/backups/eks-${{ github.event.inputs.environment }}-${BACKUP_DATE}.tfstate" \
            --sse AES256
          
          echo "State backed up: eks-${{ github.event.inputs.environment }}-${BACKUP_DATE}.tfstate"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [terraform]
    if: success() && github.event.inputs.action == 'apply'
    steps:
      - name: Success notification
        run: |
          echo "✅ Infrastructure deployment successful"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Outputs available in artifacts"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [terraform]
    if: failure()
    steps:
      - name: Failure notification
        run: |
          echo "❌ Infrastructure deployment failed"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Please review logs above"
          exit 1
