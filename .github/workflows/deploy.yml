name: Build and Deploy Fraud Service

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fraud-detection-service
  FRONTEND_TAG_PREFIX: web
  BACKEND_TAG_PREFIX: api
  EKS_CLUSTER_NAME_UAT: eks-karpenter-obsv-dev
  EKS_CLUSTER_NAME_PROD: eks-karpenter-obsv-prod
  K8S_NAMESPACE: application

permissions:
  id-token: write
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    outputs:
      backend_image_uri: ${{ steps.export-images.outputs.backend_image_uri }}
      frontend_image_uri: ${{ steps.export-images.outputs.frontend_image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run unit tests
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Run Ruff lint
        run: |
          pip install ruff
          ruff check app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend ARM64 image
        working-directory: app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=${REGISTRY}/${ECR_REPOSITORY}:${BACKEND_TAG_PREFIX}-${IMAGE_TAG}
          docker buildx build \
            --platform linux/arm64 \
            --tag ${IMAGE_URI} \
            --push .
          echo "BACKEND_IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Build and push frontend ARM64 image
        working-directory: app/frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FRONTEND_IMAGE_URI=${REGISTRY}/${ECR_REPOSITORY}:${FRONTEND_TAG_PREFIX}-${IMAGE_TAG}
          docker buildx build \
            --platform linux/arm64 \
            --tag ${FRONTEND_IMAGE_URI} \
            --push .
          echo "FRONTEND_IMAGE_URI=${FRONTEND_IMAGE_URI}" >> $GITHUB_ENV

      - name: Run Trivy vulnerability scan on image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Run Trivy vulnerability scan on frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Export image outputs
        id: export-images
        run: |
          echo "backend_image_uri=${BACKEND_IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "frontend_image_uri=${FRONTEND_IMAGE_URI}" >> $GITHUB_OUTPUT

  deploy-uat:
    runs-on: ubuntu-latest
    needs: build-test-scan
    environment: uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for UAT
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_UAT || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for UAT
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME_UAT}

      - name: Deploy manifests and update image in UAT
        run: |
          sed "s|REPLACE_WITH_ECR_IMAGE_URI:latest|${{ needs.build-test-scan.outputs.backend_image_uri }}|g" k8s/deployment.yaml | kubectl apply -f -
          sed "s|REPLACE_WITH_FRONTEND_ECR_IMAGE_URI:latest|${{ needs.build-test-scan.outputs.frontend_image_uri }}|g" k8s/frontend-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/fraud-detection --timeout=180s
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/fraud-frontend --timeout=180s

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-test-scan, deploy-uat]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for production
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME_PROD}

      - name: Deploy manifests and update image in production
        run: |
          sed "s|REPLACE_WITH_ECR_IMAGE_URI:latest|${{ needs.build-test-scan.outputs.backend_image_uri }}|g" k8s/deployment.yaml | kubectl apply -f -
          sed "s|REPLACE_WITH_FRONTEND_ECR_IMAGE_URI:latest|${{ needs.build-test-scan.outputs.frontend_image_uri }}|g" k8s/frontend-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/fraud-detection --timeout=180s
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/fraud-frontend --timeout=180s
