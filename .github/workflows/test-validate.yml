name: Test & Validate

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - '.github/workflows/**'
  push:
    branches:
      - develop

jobs:
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint
      
      - name: Run Black formatter check
        run: black --check app/
        continue-on-error: true
      
      - name: Run isort import check
        run: isort --check-only app/
        continue-on-error: true
      
      - name: Run pylint
        run: |
          pylint app/*.py --disable=all --enable=E,F
        continue-on-error: true
      
      - name: Run flake8
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

  python-test:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run app tests
        run: pytest app/test_validation.py app/test_fraud_service.py -v --cov=app --cov-report=xml
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Check dependencies for vulnerabilities
        run: pip install -r app/requirements.txt && safety check
        continue-on-error: true
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-report.json

  validate-config:
    name: Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic fastapi
      
      - name: Validate app configuration
        run: |
          python << 'EOF'
          import sys
          sys.path.insert(0, '.')
          from app.config import ServiceConfig
          try:
              # Test with production settings
              import os
              os.environ['ENVIRONMENT'] = 'production'
              config = ServiceConfig.from_env()
              print(f"✓ Production config valid: {config}")
              
              # Test with local settings
              os.environ['ENVIRONMENT'] = 'local'
              config = ServiceConfig.from_env()
              print(f"✓ Local config valid: {config}")
              
              print("Configuration validation: PASSED")
          except Exception as e:
              print(f"Configuration validation FAILED: {e}")
              sys.exit(1)
          EOF

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: fraud-detection
            dockerfile: app/Dockerfile
          - name: frontend
            dockerfile: app/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
      
      - name: Validate Kubernetes manifests
        run: |
          ./kubeval k8s/*.yaml --skip-kinds PodDisruptionBudget
          echo "Kubernetes validation: PASSED"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, security-scan, validate-config, docker-build, k8s-validate]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "                  TEST SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo "✓ Python Lint: ${{ needs.python-lint.result }}"
          echo "✓ Python Tests: ${{ needs.python-test.result }}"
          echo "✓ Security Scan: ${{ needs.security-scan.result }}"
          echo "✓ Config Validation: ${{ needs.validate-config.result }}"
          echo "✓ Docker Build: ${{ needs.docker-build.result }}"
          echo "✓ K8s Validation: ${{ needs.k8s-validate.result }}"
          echo "═══════════════════════════════════════════════════════════════"
