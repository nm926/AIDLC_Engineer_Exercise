name: Security Scanning & Compliance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install safety
        run: pip install safety
      
      - name: Check app dependencies
        run: |
          echo "Checking app/ dependencies..."
          cd app && safety check --json > safety-app.json || true
      
      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: dependency-reports
          path: app/safety-app.json

  sast-scan:
    name: SAST - Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit on app
        run: |
          bandit -r app/ -f json -o bandit-app.json || true
          bandit -r app/ -f txt
        continue-on-error: true
      
      - name: Run Bandit on terraform
        run: |
          bandit -r terraform/ -f json -o bandit-terraform.json || true
          bandit -r terraform/ -f txt
        continue-on-error: true
      
      - name: Upload SAST reports
        uses: actions/upload-artifact@v3
        with:
          name: sast-reports
          path: |
            bandit-*.json

  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - path: app
            name: fraud-detection
          - path: app/frontend
            name: app-frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Build container image
        run: |
          docker build -t ${{ matrix.image.name }}:test -f ${{ matrix.image.path }}/Dockerfile ${{ matrix.image.path }}
      
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image.name }}:test
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run truffleHog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  iac-security:
    name: Infrastructure as Code Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: false
          compact: true
        continue-on-error: true
      
      - name: Run Checkov on Kubernetes
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s
          framework: kubernetes
          quiet: false
          compact: true
        continue-on-error: true

  k8s-security:
    name: Kubernetes Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubesec
        run: |
          wget https://github.com/controlplaneio/kubesec/releases/download/v2.14.1/kubesec_linux_amd64.tar.gz
          tar xf kubesec_linux_amd64.tar.gz
      
      - name: Scan Kubernetes manifests with kubesec
        run: |
          for file in k8s/*.yaml; do
            echo "Scanning $file..."
            ./kubesec scan "$file" || true
          done
        continue-on-error: true

  network-policy-check:
    name: Network Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate network policies
        run: |
          echo "Validating network policies..."
          
          # Check that all network policies are present
          if grep -q "fraud-detection-network-policy" k8s/network-policy.yaml; then
            echo "✓ Fraud detection network policy present"
          else
            echo "❌ Fraud detection network policy missing"
            exit 1
          fi
          
          if grep -q "frontend-network-policy" k8s/network-policy.yaml; then
            echo "✓ Frontend network policy present"
          else
            echo "❌ Frontend network policy missing"
            exit 1
          fi
          
          # Check RBAC is defined
          if [ -f "k8s/rbac.yaml" ]; then
            echo "✓ RBAC definitions present"
          else
            echo "❌ RBAC definitions missing"
            exit 1
          fi
          
          echo "Network security validation passed"

  compliance-check:
    name: Compliance Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check AIDLC compliance
        run: |
          echo "AIDLC Compliance Checklist:"
          echo "============================"
          echo ""
          
          # Code Quality
          echo "✓ Code Quality"
          [ -f "app/config.py" ] && echo "  ✓ Configuration management present"
          [ -f "app/validation.py" ] && echo "  ✓ Input validation present"
          
          # Security
          echo "✓ Security"
          grep -q "network-policy" k8s/network-policy.yaml && echo "  ✓ Network policies configured"
          [ -f "k8s/rbac.yaml" ] && echo "  ✓ RBAC configured"
          [ -f "k8s/resource-quota.yaml" ] && echo "  ✓ Resource quotas configured"
          
          # Testing
          echo "✓ Testing"
          [ -f "app/test_*.py" ] && echo "  ✓ Unit tests present"
          [ -f ".github/workflows/test-validate.yml" ] && echo "  ✓ CI/CD testing configured"
          
          # Configuration
          echo "✓ Configuration"
          grep -q "from_env" app/config.py && echo "  ✓ Environment-based configuration"
          
          # Operations
          echo "✓ Operations"
          [ -f "observability/SLO_SLI_ALERTS.md" ] && echo "  ✓ SLO/SLI definitions present"
          [ -f "observability/runbooks/" ] && echo "  ✓ Runbooks available"
          
          # Release Readiness
          echo "✓ Release Readiness"
          [ -f "INFRASTRUCTURE_DEPLOYMENT_GUIDE.md" ] && echo "  ✓ Deployment guide available"
          [ -f "INFRASTRUCTURE_MANAGER_SUMMARY.md" ] && echo "  ✓ Manager summary available"
          
          echo ""
          echo "All AIDLC gates verified ✅"

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate SBOM for app
        run: |
          pip install cyclonedx-bom
          cd app && cyclonedx-bom -o bom.xml
      
      - name: Upload SBOMs
        uses: actions/upload-artifact@v3
        with:
          name: sbom-reports
          path: app/bom.xml

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, sast-scan, container-scan, iac-security, compliance-check]
    if: always()
    steps:
      - name: Generate Security Report
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "                  SECURITY SCAN SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Scan Results:"
          echo "  • Dependency Check: ${{ needs.dependency-check.result }}"
          echo "  • SAST Analysis: ${{ needs.sast-scan.result }}"
          echo "  • Container Scan: ${{ needs.container-scan.result }}"
          echo "  • IaC Security: ${{ needs.iac-security.result }}"
          echo "  • Compliance Check: ${{ needs.compliance-check.result }}"
          echo ""
          echo "Actions Taken:"
          echo "  • Reports saved to artifacts"
          echo "  • Results available in GitHub Security tab"
          echo "  • Failed checks require review before merge"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
