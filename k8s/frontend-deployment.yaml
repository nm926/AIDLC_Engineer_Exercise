apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-frontend
  namespace: application
  labels:
    app: fraud-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-frontend
  template:
    metadata:
      labels:
        app: fraud-frontend
    spec:
      containers:
        - name: fraud-frontend
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cp /code/package.json /code/vite.config.js /code/index.html /app/ &&
              mkdir -p /app/src &&
              cp /code/main.jsx /app/src/main.jsx &&
              cp /code/App.jsx /app/src/App.jsx &&
              cp /code/App.css /app/src/App.css &&
              npm install --no-audit --no-fund &&
              npm run dev -- --host 0.0.0.0 --port 80
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: frontend-workdir
              mountPath: /app
            - name: frontend-code
              mountPath: /code
              readOnly: true
      volumes:
        - name: frontend-code
          configMap:
            name: frontend-code
        - name: frontend-workdir
          emptyDir: {}
